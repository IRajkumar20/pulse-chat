<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #0b0b17; --glass: rgba(255,255,255,.05); --glass2: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.09); --text: #eef0ff; --muted: #9a9cc0;
    --a1: #7c5cff; --a2: #ff5cb8; --a3: #29d3c4;
    --grad: linear-gradient(135deg, var(--a1), var(--a2));
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); }
  body::before, body::after { content: ""; position: fixed; width: 520px; height: 520px; border-radius: 50%; filter: blur(110px); opacity: .35; z-index: 0; }
  body::before { background: var(--a1); top: -160px; left: -120px; }
  body::after { background: var(--a2); bottom: -180px; right: -120px; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  input { font: inherit; color: var(--text); }
  ::placeholder { color: var(--muted); }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* login */
  #login { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .card { width: 360px; padding: 38px 32px; border-radius: 24px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(20px); text-align: center; }
  .logo { width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 22px; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 10px 30px #7c5cff66; }
  .card h2 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .card input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); outline: none; margin-bottom: 14px; }
  .card input:focus { border-color: var(--a1); box-shadow: 0 0 0 3px #7c5cff33; }
  .primary { background: var(--grad); border-radius: 14px; font-weight: 600; padding: 13px; width: 100%; box-shadow: 0 8px 22px #7c5cff55; transition: transform .15s; }
  .primary:hover { transform: translateY(-1px); }

  /* layout */
  #app { display: none; position: relative; z-index: 1; height: 100vh; padding: 18px; gap: 18px; max-width: 1500px; margin: 0 auto; }
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 24px; backdrop-filter: blur(22px); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  #side { width: 360px; flex-shrink: 0; }
  #main { flex: 1; min-width: 0; }

  .me { display: flex; align-items: center; gap: 12px; padding: 18px 18px 8px; }
  .me .name { font-weight: 700; font-size: 18px; flex: 1; }
  .me .sub { font-size: 12px; color: var(--a3); font-weight: 400; display: block; }

  .avatar { width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; position: relative; }
  .dot { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; background: var(--a3); border: 3px solid #14142a; border-radius: 50%; }

  .tabs { display: flex; margin: 10px 18px; padding: 4px; background: var(--glass); border-radius: 14px; gap: 4px; }
  .tab { flex: 1; padding: 9px 6px; border-radius: 11px; background: none; color: var(--muted); font-size: 14px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .tab.on { background: var(--grad); color: #fff; box-shadow: 0 4px 14px #7c5cff55; }
  .pill { background: var(--a2); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }
  .tab.on .pill { background: #fff; color: var(--a1); }

  #search { margin: 0 18px 8px; padding: 11px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); outline: none; }
  #search:focus { border-color: var(--a1); }
  #list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .section { padding: 12px 10px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; cursor: pointer; transition: background .15s; }
  .row:hover { background: var(--glass); }
  .row.active { background: var(--glass2); box-shadow: inset 3px 0 0 var(--a2); }
  .row .info { flex: 1; min-width: 0; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tm { font-size: 11px; color: var(--muted); }
  .row .last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .badge { background: var(--grad); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; display: flex; align-items: center; justify-content: center; }
  .row.unread .last { color: var(--text); }

  .btn { padding: 7px 13px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--glass2); white-space: nowrap; }
  .btn.add { background: var(--grad); color: #fff; }
  .btn.ok { background: var(--a3); color: #07201d; }
  .btn.no { background: var(--glass2); color: var(--muted); }
  .btn.wait { color: var(--muted); }
  .btn:hover { filter: brightness(1.15); }
  .acts { display: flex; gap: 6px; }

  /* chat */
  #placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 20px; }
  #placeholder .logo { width: 96px; height: 96px; font-size: 46px; border-radius: 32px; margin-bottom: 20px; }
  #placeholder h2 { color: var(--text); margin: 0 0 6px; }
  #chat { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--glass); }
  .head .title { font-weight: 700; }
  .head .sub { font-size: 12px; color: var(--muted); }
  .head .sub.on { color: var(--a3); }
  #back { display: none; background: none; font-size: 22px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 6%; display: flex; flex-direction: column; gap: 6px; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--glass); border: 1px solid var(--line); padding: 4px 12px; border-radius: 20px; margin: 10px 0; }
  .msg { max-width: 64%; padding: 10px 14px 8px; border-radius: 20px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  .msg.mine { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 6px; box-shadow: 0 6px 18px #7c5cff44; }
  .msg.theirs { align-self: flex-start; background: var(--glass2); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg .t { display: block; text-align: right; font-size: 10px; opacity: .65; margin-top: 3px; }
  @keyframes pop { from { transform: translateY(6px) scale(.97); opacity: 0; } }

  #form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  #input { flex: 1; padding: 13px 18px; border-radius: 26px; border: 1px solid var(--line); background: var(--glass); outline: none; }
  #input:focus { border-color: var(--a1); }
  #send { width: 48px; height: 48px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px #7c5cff55; }
  #locked { display: none; padding: 18px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); font-size: 14px; }
  #locked .acts { justify-content: center; margin-top: 10px; }
  #status { display: none; background: var(--a2); text-align: center; font-size: 13px; padding: 4px; }

  /* video call */
  .callbtn { margin-left: auto; width: 42px; height: 42px; border-radius: 14px; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px #7c5cff55; }
  .overlay { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(8,8,20,.88); backdrop-filter: blur(14px); align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
  .overlay.show { display: flex; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 #7c5cffaa, 0 0 0 0 #ff5cb866; } 100% { box-shadow: 0 0 0 34px #7c5cff00, 0 0 0 70px #ff5cb800; } }
  @keyframes popIn { from { transform: translateY(30px) scale(.92); opacity: 0; } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20%,60% { transform: rotate(-14deg); } 40%,80% { transform: rotate(14deg); } }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }

  /* incoming call popup */
  #incoming { background: rgba(8,8,20,.6); }
  .callcard { width: 320px; padding: 34px 26px 28px; border-radius: 30px; text-align: center; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #24204a, #17152e); border: 1px solid var(--line); box-shadow: 0 30px 80px #000a, 0 0 0 1px #7c5cff33; animation: popIn .35s cubic-bezier(.2,1.3,.4,1); }
  .callcard::before { content: ""; position: absolute; inset: -40% -40% auto; height: 260px; background: radial-gradient(circle, #7c5cff55, transparent 60%); pointer-events: none; }
  .callcard .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--a3); background: #29d3c41a; padding: 5px 12px; border-radius: 20px; }
  .bigav { width: 104px; height: 104px; border-radius: 36px; font-size: 44px; margin: 26px auto 18px; animation: ring 1.6s infinite; }
  .callcard h2 { margin: 0 0 4px; font-size: 24px; }
  .callcard p { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  .callcard p::after, #ringText::after { content: ""; animation: dots 1.2s steps(1) infinite; }
  .callcard .row2 { justify-content: center; gap: 56px; }
  .callcard .lbl { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .ctl.accept { animation: shake 1.2s infinite; box-shadow: 0 0 0 0 #29d3c4; }
  .ctl.big { width: 64px; height: 64px; font-size: 26px; }

  /* outgoing ringing layer (on top of call view until connected) */
  #ringing { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: radial-gradient(circle at 50% 35%, #2a2160, #07070f 70%); }
  #ringing.show { display: flex; }
  #ringing h2 { margin: 0; font-size: 28px; }
  #ringText { color: var(--muted); }
  #callTimer { font-variant-numeric: tabular-nums; }

  /* toast */
  #toasts { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { padding: 11px 18px; border-radius: 14px; background: #1d1b38ee; border: 1px solid var(--line); box-shadow: 0 10px 30px #0008; font-size: 14px; animation: popIn .25s ease-out; backdrop-filter: blur(10px); }
  .toast.bad { border-color: #ff4d6d88; }
  #callView { background: #05050c; gap: 0; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #0b0b17; }
  #localVideo { position: absolute; right: 20px; top: 20px; width: 190px; aspect-ratio: 4/3; object-fit: cover; border-radius: 18px; border: 2px solid var(--line); background: #111; transform: scaleX(-1); box-shadow: 0 10px 30px #0008; }
  #callInfo { position: absolute; left: 24px; top: 22px; font-weight: 600; text-shadow: 0 2px 8px #000; }
  #callInfo small { display: block; font-weight: 400; color: #ddd; }
  #controls { position: absolute; bottom: 30px; display: flex; gap: 16px; }
  .ctl { width: 58px; height: 58px; border-radius: 50%; background: var(--glass2); font-size: 22px; border: 1px solid var(--line); backdrop-filter: blur(10px); }
  .ctl.off { background: #fff; color: #111; }
  .ctl.end, .ctl.decline { background: #ff4d6d; }
  .ctl.accept { background: var(--a3); }
  .row2 { display: flex; gap: 24px; }

  @media (max-width: 760px) {
    #localVideo { width: 110px; }
    #app { padding: 0; gap: 0; }
    .panel { border-radius: 0; border: 0; }
    #side { width: 100%; }
    #main { display: none; }
    #app.chatting #side { display: none; }
    #app.chatting #main { display: flex; }
    #back { display: block; }
    #messages { padding: 14px; }
    .msg { max-width: 85%; }
  }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="logo">💬</div>
    <h2>Welcome</h2>
    <p>Pick a name to start chatting with friends</p>
    <input id="user" placeholder="Your name" maxlength="30" autofocus>
    <button class="primary" onclick="join()">Continue</button>
  </div>
</div>

<div id="app">
  <div id="side" class="panel">
    <div class="me">
      <div class="avatar" id="meAvatar"></div>
      <div class="name"><span id="meName"></span><span class="sub">● online</span></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="chats">Chats</button>
      <button class="tab" data-tab="people">People</button>
      <button class="tab" data-tab="requests">Requests <span class="pill" id="reqCount" style="display:none"></span></button>
    </div>
    <input id="search" placeholder="Search" autocomplete="off">
    <div id="list"></div>
  </div>

  <div id="main" class="panel">
    <div id="placeholder">
      <div class="logo">💬</div>
      <h2>Your conversations</h2>
      <div>Select a friend, or find people and send a friend request.</div>
    </div>
    <div id="chat">
      <div class="head">
        <button id="back" onclick="closeChat()">←</button>
        <div class="avatar" id="peerAvatar"></div>
        <div><div class="title" id="peerName"></div><div class="sub" id="peerStatus"></div></div>
        <button class="callbtn" onclick="startCall()" title="Video call" aria-label="Video call">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>
        </button>
      </div>
      <div id="status">Disconnected. Refresh to reconnect.</div>
      <div id="messages"></div>
      <div id="form">
        <input id="input" placeholder="Type a message" autocomplete="off">
        <button id="send" onclick="send()" aria-label="Send">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <div id="locked"></div>
    </div>
  </div>
</div>

<div id="incoming" class="overlay">
  <div class="callcard">
    <span class="tag">📹 Video call</span>
    <div class="avatar bigav" id="inAvatar"></div>
    <h2 id="inName"></h2>
    <p>is calling you</p>
    <div class="row2">
      <div><button class="ctl decline big" onclick="rejectCall()" aria-label="Decline">✕</button><span class="lbl">Decline</span></div>
      <div><button class="ctl accept big" onclick="acceptCall()" aria-label="Accept">📹</button><span class="lbl">Accept</span></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div id="callView" class="overlay">
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="ringing">
    <div class="avatar bigav" id="ringAvatar"></div>
    <h2 id="ringName"></h2>
    <div id="ringText">Calling</div>
  </div>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="callInfo"><span id="callName"></span><small id="callState"></small></div>
  <div id="controls">
    <button class="ctl" id="micBtn" onclick="toggleTrack('audio', this)" aria-label="Mute">🎤</button>
    <button class="ctl" id="camBtn" onclick="toggleTrack('video', this)" aria-label="Camera">📷</button>
    <button class="ctl end" onclick="endCall(true)" aria-label="End call">📞</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GRADS = [["#7c5cff","#5c9bff"],["#ff5cb8","#ff8a5c"],["#29d3c4","#5c9bff"],["#ffb85c","#ff5c7c"],["#8a5cff","#ff5cb8"],["#29d38a","#29a8d3"]];
const hash = n => [...n].reduce((a, c) => a + c.charCodeAt(0), 0);
const bg = n => { const g = GRADS[hash(n) % GRADS.length]; return `linear-gradient(135deg,${g[0]},${g[1]})`; };
const initial = n => esc(n[0].toUpperCase());

let ws, me, current = null, tab = "chats", users = [];
const convos = {}, unread = {};
let lastDay = null;

const time = ts => new Date(ts).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const dayLabel = ts => {
  const d = new Date(ts);
  if (d.toDateString() === new Date().toDateString()) return "Today";
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return "Yesterday";
  return d.toLocaleDateString([], {day: "numeric", month: "short", year: "numeric"});
};
const peerOf = m => m.from === me ? m.to : m.from;
const act = (action, to) => ws.readyState === 1 && ws.send(JSON.stringify({action, to}));
const rel = n => (users.find(u => u.name === n) || {}).relation;

function join() {
  me = $("user").value.trim();
  if (!me) return $("user").focus();
  unlockAudio();  // must happen on a click so ringtones can play later
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(me)}`);
  ws.onopen = () => {
    $("login").style.display = "none";
    $("app").style.display = "flex";
    $("meName").textContent = me;
    const a = $("meAvatar"); a.style.background = bg(me); a.textContent = me[0].toUpperCase();
    $("status").style.display = "none";
  };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { $("status").style.display = "block"; };
}

function handle(d) {
  if (d.type === "state") {
    users = d.users; renderList(); updateChatHeader();
  } else if (d.type === "history") {
    d.messages.forEach(m => (convos[peerOf(m)] ||= []).push(m));
    renderList();
  } else if (d.type === "signal") {
    onSignal(d.from, d.data);
  } else if (d.type === "message") {
    const p = peerOf(d);
    (convos[p] ||= []).push(d);
    if (p === current) appendMsg(d); else if (d.from !== me) unread[p] = (unread[p] || 0) + 1;
    renderList();
  }
}

function userRow(u, right, clickable) {
  const last = (convos[u.name] || []).at(-1);
  const sub = last ? (last.from === me ? "You: " : "") + last.text : (u.online ? "Online" : "Offline");
  const n = unread[u.name] || 0;
  return `<div class="row ${u.name === current ? "active" : ""} ${n ? "unread" : ""}" ${clickable ? `data-open="${esc(u.name)}"` : ""}>
    <div class="avatar" style="background:${bg(u.name)}">${initial(u.name)}${u.online ? '<span class="dot"></span>' : ""}</div>
    <div class="info"><div class="top"><span class="nm">${esc(u.name)}</span><span class="tm">${last && clickable ? time(last.ts) : ""}</span></div>
    <div class="last">${esc(sub)}</div></div>${right}</div>`;
}

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const match = u => u.name.toLowerCase().includes(q);
  const incoming = users.filter(u => u.relation === "received");
  const pill = $("reqCount");
  pill.textContent = incoming.length; pill.style.display = incoming.length ? "inline-flex" : "none";
  let html = "";

  if (tab === "chats") {
    const f = users.filter(u => u.relation === "friend" && match(u)).sort((a, b) =>
      (+new Date((convos[b.name] || []).at(-1)?.ts || 0)) - (+new Date((convos[a.name] || []).at(-1)?.ts || 0)));
    html = f.map(u => userRow(u, (unread[u.name] ? `<span class="badge">${unread[u.name]}</span>` : ""), true)).join("")
      || `<div class="empty">No friends yet.<br>Go to <b>People</b> to send a request.</div>`;
  } else if (tab === "people") {
    const p = users.filter(u => u.relation !== "friend" && u.relation !== "received" && match(u));
    html = p.map(u => userRow(u, u.relation === "sent"
      ? `<button class="btn wait" data-cancel="${esc(u.name)}">Pending ✕</button>`
      : `<button class="btn add" data-req="${esc(u.name)}">Add</button>`, false)).join("")
      || `<div class="empty">No one to add right now.<br>Open another tab and join with a different name.</div>`;
  } else {
    const r = incoming.filter(match);
    html = r.map(u => userRow(u, `<div class="acts"><button class="btn ok" data-acc="${esc(u.name)}">Accept</button><button class="btn no" data-dec="${esc(u.name)}">✕</button></div>`, false)).join("")
      || `<div class="empty">No pending requests.</div>`;
    const sent = users.filter(u => u.relation === "sent" && match(u));
    if (sent.length) html += `<div class="section">Sent</div>` + sent.map(u => userRow(u, `<button class="btn wait" data-cancel="${esc(u.name)}">Cancel</button>`, false)).join("");
  }
  $("list").innerHTML = html;
}

$("list").addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-req],[data-cancel],[data-acc],[data-dec]");
  if (!t) return;
  const d = t.dataset;
  if (d.req) act("request", d.req);
  else if (d.cancel) act("cancel", d.cancel);
  else if (d.acc) act("accept", d.acc);
  else if (d.dec) act("decline", d.dec);
  else if (d.open) openChat(d.open);
});

document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  renderList();
});
$("search").addEventListener("input", renderList);

function openChat(name) {
  current = name; unread[name] = 0;
  $("placeholder").style.display = "none";
  $("chat").style.display = "flex";
  $("app").classList.add("chatting");
  $("peerName").textContent = name;
  const a = $("peerAvatar"); a.style.background = bg(name); a.textContent = name[0].toUpperCase();
  $("messages").innerHTML = ""; lastDay = null;
  (convos[name] || []).forEach(appendMsg);
  updateChatHeader(); renderList(); $("input").focus();
}

function closeChat() {
  current = null;
  $("chat").style.display = "none";
  $("placeholder").style.display = "flex";
  $("app").classList.remove("chatting");
  renderList();
}

function updateChatHeader() {
  if (!current) return;
  const u = users.find(u => u.name === current);
  if (!u || u.relation !== "friend") return closeChat();
  const s = $("peerStatus");
  s.textContent = u.online ? "online" : "offline";
  s.className = "sub" + (u.online ? " on" : "");
}

function appendMsg(m) {
  const box = $("messages");
  const dl = dayLabel(m.ts);
  if (dl !== lastDay) {
    lastDay = dl;
    const d = document.createElement("div"); d.className = "day"; d.textContent = dl; box.appendChild(d);
  }
  const el = document.createElement("div");
  el.className = "msg " + (m.from === me ? "mine" : "theirs");
  el.innerHTML = `${esc(m.text)}<span class="t">${time(m.ts)}</span>`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function send() {
  const v = $("input").value.trim();
  if (v && current && rel(current) === "friend" && ws.readyState === 1) {
    ws.send(JSON.stringify({action: "message", to: current, text: v}));
    $("input").value = "";
  }
}

/* ---------- video call (WebRTC) ---------- */
const RTC_CONFIG = {iceServers: [{urls: "stun:stun.l.google.com:19302"}, {urls: "stun:stun1.l.google.com:19302"}]};
let pc = null, localStream = null, callPeer = null, pendingOffer = null, pendingIce = [], ringTimer = null;
let callStart = null, timerInt = null, titleInt = null, notif = null;

const signal = (to, data) => ws.readyState === 1 && ws.send(JSON.stringify({action: "signal", to, data}));
const setState = t => $("callState").textContent = t;
const fmt = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

/* sounds: generated with Web Audio, no audio files needed */
let audioCtx = null, toneTimer = null;
function unlockAudio() {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
}
function beep(freqs, dur, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime, g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + dur - 0.05);
  g.gain.linearRampToValueAtTime(0, t + dur);
  g.connect(audioCtx.destination);
  freqs.forEach(f => { const o = audioCtx.createOscillator(); o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + dur); });
}
function playTone(kind) {
  stopTone();
  const play = kind === "incoming"
    ? () => { beep([880, 1320], .35, .18); setTimeout(() => beep([880, 1320], .35, .18), 450); }
    : () => beep([440, 480], 1.6, .08);
  play();
  toneTimer = setInterval(play, kind === "incoming" ? 2200 : 4000);
}
function stopTone() { clearInterval(toneTimer); toneTimer = null; }

function toast(text, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : ""); t.textContent = text;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function flashTitle(text) {
  stopTitle(); let on = false;
  titleInt = setInterval(() => { document.title = (on = !on) ? text : "Chat"; }, 1000);
}
function stopTitle() { clearInterval(titleInt); titleInt = null; document.title = "Chat"; }

function notifyIncoming(from) {
  if (!("Notification" in window) || Notification.permission !== "granted" || !document.hidden) return;
  try {
    notif = new Notification("Incoming video call", {body: `${from} is calling you`, tag: "call", requireInteraction: true});
    notif.onclick = () => { window.focus(); notif && notif.close(); };
  } catch {}
}

function closeIncoming() {
  pendingOffer = null;
  $("incoming").classList.remove("show");
  stopTone(); stopTitle();
  if (notif) { notif.close(); notif = null; }
}

async function getMedia() {
  if (!navigator.mediaDevices) {
    toast("Camera needs HTTPS. Open the app through the https tunnel link or http://localhost:8000.", true);
    return null;
  }
  try {
    return await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  } catch (e) {
    toast("Could not access camera/microphone: " + e.message, true);
    return null;
  }
}

function createPC(peer) {
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => e.candidate && signal(peer, {kind: "ice", candidate: e.candidate});
  pc.ontrack = e => { $("remoteVideo").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === "connected" && !callStart) {
      $("ringing").classList.remove("show");
      callStart = Date.now();
      setState("00:00");
      timerInt = setInterval(() => setState(fmt(Date.now() - callStart)), 1000);
    }
    if (["failed", "closed"].includes(pc.connectionState)) endCall(false, "Call failed (network blocked the connection)");
  };
}

function showCall(peer, ringText) {
  $("callName").textContent = peer;
  setState("");
  $("ringName").textContent = peer;
  const a = $("ringAvatar"); a.style.background = bg(peer); a.textContent = peer[0].toUpperCase();
  $("ringText").textContent = ringText;
  $("ringing").classList.add("show");
  $("localVideo").srcObject = localStream;
  $("micBtn").classList.remove("off"); $("camBtn").classList.remove("off");
  $("callView").classList.add("show");
}

async function startCall() {
  if (!current || callPeer) return;
  if (rel(current) !== "friend") return;
  unlockAudio();
  const stream = await getMedia(); if (!stream) return;
  localStream = stream; callPeer = current; callStart = null;
  createPC(callPeer);
  showCall(callPeer, "Calling");
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  signal(callPeer, {kind: "offer", sdp: pc.localDescription});
  ringTimer = setTimeout(() => endCall(true, "No answer"), 45000);
}

async function onSignal(from, d) {
  if (d.kind === "offer") {
    if (callPeer || pendingOffer) return signal(from, {kind: "busy"});
    pendingOffer = {from, sdp: d.sdp}; pendingIce = [];
    const a = $("inAvatar"); a.style.background = bg(from); a.textContent = from[0].toUpperCase();
    $("inName").textContent = from;
    $("incoming").classList.add("show");
    playTone("incoming");
    flashTitle(`📞 ${from} is calling…`);
    notifyIncoming(from);
    signal(from, {kind: "ringing"});
  } else if (d.kind === "ringing" && from === callPeer && !callStart) {
    $("ringText").textContent = "Ringing";
    playTone("outgoing");
  } else if (d.kind === "answer" && from === callPeer && pc) {
    clearTimeout(ringTimer);
    stopTone();
    $("ringText").textContent = "Connecting";
    await pc.setRemoteDescription(d.sdp);
    for (const c of pendingIce) await pc.addIceCandidate(c);
    pendingIce = [];
  } else if (d.kind === "ice") {
    if (pc && pc.remoteDescription && from === callPeer) pc.addIceCandidate(d.candidate).catch(() => {});
    else if (from === callPeer || (pendingOffer && pendingOffer.from === from)) pendingIce.push(d.candidate);
  } else if (d.kind === "end" || d.kind === "reject" || d.kind === "busy" || d.kind === "unavailable") {
    if (pendingOffer && pendingOffer.from === from) {
      closeIncoming();
      toast(`Missed call from ${from}`);
      return;
    }
    if (from === callPeer) {
      const msg = {reject: `${from} declined the call`, busy: `${from} is on another call`, unavailable: `${from} is offline`}[d.kind];
      endCall(false, msg);
    }
  }
}

async function acceptCall() {
  if (!pendingOffer) return;
  const {from, sdp} = pendingOffer;
  unlockAudio();
  closeIncoming();
  callPeer = from; callStart = null;  // set early so ICE candidates are queued while the camera prompt is open
  const stream = await getMedia();
  if (!stream) { signal(from, {kind: "reject"}); callPeer = null; pendingIce = []; return; }
  localStream = stream;
  createPC(from);
  showCall(from, "Connecting");
  await pc.setRemoteDescription(sdp);
  for (const c of pendingIce) await pc.addIceCandidate(c);
  pendingIce = [];
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  signal(from, {kind: "answer", sdp: pc.localDescription});
}

function rejectCall() {
  if (!pendingOffer) return;
  signal(pendingOffer.from, {kind: "reject"});
  pendingIce = [];
  closeIncoming();
}

function endCall(notify, message) {
  clearTimeout(ringTimer);
  stopTone();
  clearInterval(timerInt); timerInt = null;
  if (notify && callPeer) signal(callPeer, {kind: "end"});
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("remoteVideo").srcObject = null; $("localVideo").srcObject = null;
  $("callView").classList.remove("show");
  $("ringing").classList.remove("show");
  const wasConnected = callStart;
  callPeer = null; pendingIce = []; callStart = null;
  if (message) toast(message, true);
  else if (wasConnected) toast(`Call ended · ${fmt(Date.now() - wasConnected)}`);
}

function toggleTrack(kind, btn) {
  if (!localStream) return;
  const tracks = kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks();
  const on = !tracks[0]?.enabled;
  tracks.forEach(t => t.enabled = on);
  btn.classList.toggle("off", !on);
}

$("input").addEventListener("keydown", e => e.key === "Enter" && send());
$("user").addEventListener("keydown", e => e.key === "Enter" && join());
</script>
</body>
